<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>어디 갈까 — 우리나라 여행 지도</title>
<style>
:root{
  --sea:#BFE3F2; --sea2:#A9D8ED; --bg:#FBF7EF;
  --card:#FFFFFF; --line:#EBE0D0; --line2:#D9CCB8;
  --ink:#33302B; --ink2:#6E655B; --ink3:#A79C8E;
  --hot:#F2695B; --hot-bg:#FDE9E6;
  --blue:#3E9AD1; --blue-bg:#E5F2FA;
  --green:#43BE92; --green-bg:#E3F7EF;
  --gold:#EEA83A; --gold-bg:#FDF2DE;
  --grape:#8D74D6; --grape-bg:#F0EBFB;
  --sans:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--sea);color:var(--ink);font-family:var(--sans);word-break:keep-all;
     overflow:hidden;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.02em}

/* ── 사이드바 ── */
.side{position:fixed;left:12px;top:12px;bottom:12px;width:132px;z-index:25;background:var(--card);
      border:2px solid var(--line2);border-radius:18px;box-shadow:0 4px 0 rgba(140,120,90,.16);
      padding:12px 9px;overflow:auto;display:flex;flex-direction:column;gap:3px}
.side h2{font-size:12px;color:var(--ink3);letter-spacing:.08em;padding:2px 8px 7px}
.side button{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;
      border:none;background:none;font:inherit;font-size:13.5px;font-weight:800;color:var(--ink2);
      padding:8px 10px;border-radius:11px;cursor:pointer;text-align:left;transition:.12s}
.side button:hover{background:var(--bg)}
.side button.on{background:var(--green);color:#fff}
.side button em{font-style:normal;font-size:11px;font-weight:700;opacity:.55;
      font-variant-numeric:tabular-nums}
.side button.on em{opacity:.85}
.side .all{border-bottom:1.5px solid var(--line);border-radius:11px 11px 0 0;margin-bottom:4px;padding-bottom:10px}

/* ── 헤더 ── */
header{position:fixed;inset:0 0 auto 156px;z-index:20;padding:13px 16px 10px;pointer-events:none}
header>*{pointer-events:auto}
.brand{display:inline-flex;align-items:baseline;gap:9px;background:var(--card);
       border:2px solid var(--line2);border-radius:999px;padding:7px 16px;
       box-shadow:0 3px 0 rgba(140,120,90,.16)}
.brand h1{font-size:18px}
.brand span{font-size:11.5px;color:var(--ink3);font-weight:600}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{border:2px solid var(--line2);background:var(--card);color:var(--ink2);font:inherit;
      font-size:12.5px;font-weight:800;padding:6px 12px;border-radius:999px;cursor:pointer;
      transition:.14s;box-shadow:0 2px 0 rgba(140,120,90,.14)}
.chip:hover{transform:translateY(-1px)}
.chip.on{color:#fff;border-color:transparent;box-shadow:0 2px 0 rgba(0,0,0,.14)}
.chip.ktx.on{background:var(--hot)} .chip.trn.on{background:var(--ink2)}
.chip.reg.on{background:var(--green)}
.gap{width:8px}

/* ── 지도 ── */
#wrap{position:fixed;inset:0;touch-action:none;cursor:grab}
#wrap.drag{cursor:grabbing}
svg{width:100%;height:100%;display:block}
.prov{stroke:#fff;stroke-width:2.4;stroke-linejoin:round}
.city{fill:none;stroke:#fff;stroke-opacity:.85;stroke-linejoin:round;pointer-events:none}
.clabel{font-size:13px;font-weight:800;fill:#6B6152;text-anchor:middle;pointer-events:none;
        paint-order:stroke;stroke:#fff;stroke-width:4;stroke-opacity:.95}
.zoomed .plabel.pv{opacity:.28}
.plabel{font-size:15px;font-weight:800;fill:#7C6E5B;opacity:.75;pointer-events:none;
        text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:3.5}
.stn{pointer-events:none}
.stn circle{stroke:#fff;stroke-width:1.6}
.stn text{font-weight:900;fill:#2E2A26;text-anchor:middle;
          paint-order:stroke;stroke:#fff;stroke-width:4.5}
.spot{cursor:pointer}
.spot *{cursor:pointer}
.spot .disc{fill:#fff;stroke-width:3.4}
.spot .emo{font-size:24px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.spot .nm{font-size:13px;font-weight:800;text-anchor:middle;fill:var(--ink);
          paint-order:stroke;stroke:#fff;stroke-width:4;pointer-events:none}
.spot:hover .disc{stroke-width:5}
.spot.sel .disc{stroke:var(--gold);stroke-width:6}

/* ── 확대/축소 ── */
.zoom{position:fixed;right:14px;bottom:14px;z-index:20;display:grid;gap:6px}
.zoom button{width:38px;height:38px;border-radius:12px;border:2px solid var(--line2);
             background:var(--card);font-size:17px;font-weight:800;color:var(--ink2);cursor:pointer;
             box-shadow:0 2px 0 rgba(140,120,90,.16)}

/* ── 패널 ── */
.panel{position:fixed;z-index:30;right:14px;top:78px;bottom:14px;width:360px;background:var(--card);
       border:2px solid var(--line2);border-radius:20px;box-shadow:0 12px 32px rgba(70,55,35,.18);
       overflow:auto;transform:translateX(calc(100% + 24px));transition:transform .3s cubic-bezier(.2,.8,.3,1)}
.panel.open{transform:none}
.hero{position:relative;height:164px;background:var(--blue-bg);border-radius:17px 17px 0 0;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero .none{display:flex;height:100%;align-items:center;justify-content:center;font-size:54px;opacity:.55}
.close{position:absolute;top:9px;right:9px;width:31px;height:31px;border-radius:50%;border:none;
       background:rgba(255,255,255,.94);cursor:pointer;font-size:16px;color:var(--ink2);
       box-shadow:0 2px 6px rgba(0,0,0,.18)}
.pbody{padding:15px 17px 22px}
.ptitle{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.ptitle h2{font-size:19px}
.tag{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:999px}
.addr{font-size:12px;color:var(--ink3);margin-top:6px}
.desc{font-size:13.5px;line-height:1.6;color:var(--ink2);margin-top:11px}
.sec{margin-top:17px}
.sec h3{font-size:11px;letter-spacing:.1em;color:var(--ink3);margin-bottom:8px}
.go{display:grid;gap:6px}
.go div{display:flex;align-items:center;gap:9px;font-size:13px;background:var(--bg);
        border:1.5px solid var(--line);border-radius:11px;padding:8px 11px}
.go b{margin-left:auto;font-variant-numeric:tabular-nums}
.list{display:grid;gap:5px}
.list a{display:flex;align-items:baseline;gap:7px;text-decoration:none;color:inherit;font-size:13px;
        padding:8px 11px;border-radius:11px;border:1.5px solid var(--line);background:var(--card)}
.list a:hover{background:var(--gold-bg);border-color:var(--gold)}
.list .n{font-weight:700} .list .c{font-size:11px;color:var(--ink3)}
.list .d{margin-left:auto;font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums}
.dist{background:var(--blue-bg);border:1.5px solid var(--blue);border-radius:12px;padding:10px 13px;
      font-size:14px;color:var(--ink2)}
.dist b{color:var(--blue);font-size:16px}
.dist span{display:block;font-size:11.5px;color:var(--ink3);margin-top:3px}
.routes{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
.routes a{display:block;text-align:center;text-decoration:none;font-size:13.5px;font-weight:800;
          padding:11px 8px;border-radius:12px;border:2px solid var(--line2);background:var(--card);color:var(--ink)}
.routes a:active{background:var(--bg)}
.askloc{width:100%;font:inherit;font-size:13.5px;font-weight:700;color:var(--blue);cursor:pointer;
        background:var(--blue-bg);border:1.5px dashed var(--blue);border-radius:12px;padding:12px}
.chip.me.on{background:var(--blue)}
.spot .dot{transition:none}
.more{display:inline-block;margin-top:11px;font-size:12px;color:var(--blue);font-weight:800;text-decoration:none}
.err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:30px;z-index:50;
     background:var(--bg);text-align:center;font-size:14px;line-height:1.7;color:var(--ink2)}

@media (max-width:760px){
  .side{left:0;right:0;top:auto;bottom:0;width:auto;height:auto;max-height:none;border-radius:0;
        border-width:2px 0 0;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;
        gap:6px;padding:9px 10px;scrollbar-width:none;box-shadow:0 -3px 14px rgba(70,55,35,.13)}
  .side::-webkit-scrollbar{display:none}
  .side h2{display:none}
  .side button{width:auto;flex:0 0 auto;white-space:nowrap;padding:8px 13px;border-radius:999px;
               border:1.5px solid var(--line2)}
  .side button.on{border-color:transparent}
  .side .all{border:1.5px solid var(--line2);margin:0;padding:8px 13px;border-radius:999px}
  .zoom{right:10px;bottom:70px;gap:8px}
  .zoom button{width:44px;height:44px;font-size:19px}
  header{inset:0 0 auto 0;padding:10px 12px 8px}
  .brand{padding:6px 13px}.brand h1{font-size:16px}.brand span{display:none}
  .chip{font-size:11.5px;padding:5px 10px}
  .panel{right:0;left:0;width:auto;top:auto;height:74%;bottom:0;border-radius:20px 20px 0 0;
         border-width:2px 0 0}
  .panel.open{transform:none}
  .hero{height:150px;border-radius:18px 18px 0 0}
  .spot .nm{font-size:12.5px}
}

/* ── 검색 ── */
.searchbox{position:relative;margin-top:9px;max-width:420px}
.searchbox input{width:100%;font:inherit;font-size:14px;font-weight:600;color:var(--ink);
  padding:11px 38px 11px 38px;border:2px solid var(--line2);border-radius:999px;background:var(--card);
  box-shadow:0 2px 0 rgba(140,120,90,.14);outline:none}
.searchbox input:focus{border-color:var(--blue)}
.searchbox .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:15px;opacity:.6}
.searchbox .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:none;
  font-size:16px;color:var(--ink3);cursor:pointer;padding:4px 6px;display:none}
.searchbox.has .clr{display:block}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--card);
  border:2px solid var(--line2);border-radius:16px;box-shadow:0 10px 26px rgba(70,55,35,.18);
  max-height:56vh;overflow:auto;display:none;z-index:40}
.results.on{display:block}
.results .rg{font-family:var(--sans);font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--ink3);
  padding:9px 14px 5px;position:sticky;top:0;background:var(--card)}
.results button{display:flex;align-items:center;gap:9px;width:100%;border:none;background:none;font:inherit;
  text-align:left;padding:9px 13px;cursor:pointer;border-top:1px solid var(--line)}
.results button:hover{background:var(--bg)}
.results .e{font-size:17px;flex:0 0 auto}
.results .t{font-weight:700;font-size:13.5px}
.results .m{font-size:11.5px;color:var(--ink3);margin-top:1px}
.results .none{padding:16px 14px;font-size:13px;color:var(--ink3)}

/* ── 즐겨찾기 ── */
.star{border:none;background:none;cursor:pointer;font-size:19px;line-height:1;padding:2px 4px;
  filter:grayscale(1);opacity:.4;transition:.14s}
.star.on{filter:none;opacity:1;transform:scale(1.12)}
.ptitle .star{margin-left:auto}
.spot.fav .disc{stroke:var(--gold)!important;stroke-width:5}

/* ── 저장 리스트 ── */
.sheet{position:fixed;inset:0;z-index:60;background:rgba(40,32,22,.42);display:none;
  align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .card{background:var(--card);border-radius:22px 22px 0 0;width:100%;max-width:560px;
  max-height:86vh;overflow:auto;padding:18px 18px 26px;border:2px solid var(--line2);border-bottom:none}
.sheet h2{font-size:18px;margin-bottom:4px}
.sheet .sub2{font-size:12.5px;color:var(--ink3);margin-bottom:14px}
.lrow{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1.5px solid var(--line);
  border-radius:13px;margin-bottom:7px;background:var(--bg)}
.lrow.on{border-color:var(--blue);background:var(--blue-bg)}
.lrow .nm2{font-weight:800;font-size:14px;flex:1;cursor:pointer}
.lrow .ct{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.lrow button{border:none;background:none;cursor:pointer;font-size:14px;padding:4px 5px;color:var(--ink3)}
.mk{display:flex;gap:7px;margin:12px 0 4px}
.mk input{flex:1;font:inherit;font-size:13.5px;padding:10px 12px;border:1.5px solid var(--line2);
  border-radius:12px;background:var(--card);outline:none}
.mk button{font:inherit;font-size:13px;font-weight:800;padding:10px 15px;border-radius:12px;
  border:none;background:var(--ink);color:#fff;cursor:pointer}
.items{margin-top:12px}
.items a{display:flex;align-items:center;gap:8px;text-decoration:none;color:inherit;font-size:13.5px;
  padding:9px 11px;border-radius:11px;border:1px solid var(--line);margin-bottom:5px;background:var(--card)}
.items .d2{margin-left:auto;font-size:11px;color:var(--ink3)}
.items .rm{border:none;background:none;color:var(--ink3);cursor:pointer;font-size:13px}
.shbtn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.shbtn button{font:inherit;font-size:13.5px;font-weight:800;padding:12px;border-radius:13px;
  border:2px solid var(--line2);background:var(--card);cursor:pointer;color:var(--ink)}
.shbtn button.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--ink);color:#fff;
  font-size:13px;font-weight:700;padding:11px 18px;border-radius:999px;z-index:80;opacity:0;
  transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:760px){
  .searchbox{max-width:none}
  .sheet .card{max-height:90vh}
}
</style>
</head>
<body>

<div id="wrap"><svg id="map" aria-label="대한민국 여행 지도"></svg></div>

<nav class="side" id="side"></nav>

<header>
  <div class="brand"><h1>🧳 어디 갈까</h1><span>우리나라 여행 지도</span></div>
  <div class="bar" id="bar"></div>
  <div class="searchbox" id="sbox">
    <span class="ico">🔍</span>
    <input id="q" type="search" placeholder="어디로 갈까요? 가게 이름·주소로 찾기" autocomplete="off">
    <button class="clr" id="qclr" aria-label="지우기">✕</button>
    <div class="results" id="res"></div>
  </div>
</header>

<div class="zoom">
  <button id="zin" aria-label="확대">＋</button>
  <button id="zout" aria-label="축소">－</button>
  <button id="zfit" aria-label="전체보기" style="font-size:13px">전체</button>
</div>

<aside class="panel" id="panel"></aside>

<div class="sheet" id="sheet"><div class="card" id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=c89f0e69e80770459ec3bf5baa4680f2&autoload=false&libraries=services"></script>
<script>
const ICON={바다:"🏖️",마을:"🏘️",자연:"🌿",시장:"🍢",역사:"🏛️",전망:"🗼",카페:"☕"};
const HUE ={바다:"--blue",마을:"--hot",자연:"--green",시장:"--gold",역사:"--grape",전망:"--blue",카페:"--hot"};
const FILL=[["서울","#FFD9E1"],["부산","#CDE8FF"],["대구","#FFE7C2"],["인천","#D6F0E4"],
            ["광주","#E9DFFF"],["대전","#FFE2D2"],["울산","#D3EDF8"],["세종","#F1E7D4"],
            ["경기","#E4EFDA"],["강원","#DAEBF8"],["충청북","#FFF1CE"],["충청남","#FFE1E1"],
            ["전라북","#E1F3EA"],["전라남","#DAE9FF"],["경상북","#FFEBD8"],["경상남","#E7E1F9"],
            ["제주","#FFDEE9"]];
const NS="http://www.w3.org/2000/svg";
const hav=(a,b,c,d)=>{const R=6371,r=Math.PI/180,
  x=Math.sin((c-a)*r/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));};

let K,P=[],ST={},CT=[],ME=null,state={ktx:false,trn:false,region:null,sel:null},view={x:0,y:0,z:1},box;

const el=(t,a={})=>{const n=document.createElementNS(NS,t);
  for(const k in a) n.setAttribute(k,a[k]); return n;};
const fail=m=>document.body.insertAdjacentHTML("beforeend",`<div class="err"><div>${m}</div></div>`);

async function boot(){
  const V=Date.now();   // 캐시 무시
  const [k,p,s,c]=await Promise.all([
    fetch("data/korea.json?v="+V).then(r=>r.json()).catch(()=>null),
    fetch("data/places.json?v="+V).then(r=>r.json()).catch(()=>null),
    fetch("data/stations.json?v="+V).then(r=>r.json()).catch(()=>({})),
    fetch("data/cities.json?v="+V).then(r=>r.json()).catch(()=>[]),
  ]);
  if(!k) return fail("<b>data/korea.json</b> 이 없어요.<br>먼저 <code>python build_map.py</code> 를 실행해 주세요.");
  if(!p) return fail("<b>data/places.json</b> 이 없어요.<br>먼저 <code>python collect.py</code> 를 실행해 주세요.");
  K=k; P=p.places; ST=s||{}; CT=c||[];
  box=k.viewBox.split(" ").map(Number);
  loadLists(); buildIndex(); initKakao(); draw(); bar(); side(); fit(); wireUI(); readShare();
}

// 위경도 → SVG 좌표
const prj=(lat,lng)=>{const {lon0,lat1,k,coslat}=K.proj;
  return [(lng-lon0)*k,(lat1-lat)*k/coslat];};

function draw(){
  const svg=document.getElementById("map");
  svg.setAttribute("viewBox",K.viewBox);
  svg.innerHTML="";
  const g=el("g",{id:"cam"}); svg.appendChild(g);

  // 바다 배경 + 시도
  g.appendChild(el("rect",{x:-400,y:-400,width:box[2]+800,height:box[3]+800,fill:"var(--sea)"}));
  const land=el("g"); g.appendChild(land);
  K.provinces.forEach(pv=>{
    const f=(FILL.find(([n])=>pv.name.startsWith(n))||[,"#E9E3D8"])[1];
    land.appendChild(el("path",{d:pv.d,fill:f,class:"prov"}));
  });
  const SHORT={"충청북도":"충북","충청남도":"충남","전라북도":"전북","전북특별자치도":"전북",
               "전라남도":"전남","경상북도":"경북","경상남도":"경남","강원특별자치도":"강원",
               "제주특별자치도":"제주","경기도":"경기","강원도":"강원"};
  K.provinces.forEach(pv=>{
    const city=/시$/.test(pv.name);
    const t=el("text",{x:pv.cx,y:pv.cy,class:"plabel"});
    if(city) t.setAttribute("style","font-size:11px;opacity:.6");
    t.textContent=SHORT[pv.name]||pv.name.replace(/특별자치시|광역시|특별시/,"");
    t.classList.add("pv");
    land.appendChild(t);
  });

  g.appendChild(el("g",{id:"city"}));
  g.appendChild(el("g",{id:"stn"}));
  g.appendChild(el("g",{id:"spot"}));
  g.appendChild(el("g",{id:"me"}));
  render();
}

// 광역시는 지도엔 그대로 두고, 사이드바에서는 인접 도에 묶는다
const GROUP={부산:"경남",울산:"경남",대구:"경북",광주:"전남",대전:"충남",세종:"충남",강원:"강원도"};
const grp=p=>GROUP[p.region]||p.region;
const ORDER=["서울","경기","인천","강원도","충남","충북","경북","경남","전북","전남","제주"];

function bar(){
  const b=document.getElementById("bar");
  b.innerHTML=`<button class="chip ktx" data-l="ktx">🚄 KTX역</button>
    <button class="chip trn" data-l="trn">🚂 기차역</button>
    <button class="chip me" id="meBtn">📍 내 위치</button>
    <button class="chip" id="favBtn">⭐ 저장한 곳</button>`;

    t.classList.toggle("on",state[t.dataset.l]); render();};

function side(){

// 선택한 지역이 화면에 꽉 차도록
function zoomRegion(){
  const list=P.filter(p=>!state.region||grp(p)===state.region);
  if(!list.length) return fit();
  if(!state.region) return fit();
  const pts=list.map(p=>prj(p.lat,p.lng));
  const x0=Math.min(...pts.map(p=>p[0])), x1=Math.max(...pts.map(p=>p[0]));
  const y0=Math.min(...pts.map(p=>p[1])), y1=Math.max(...pts.map(p=>p[1]));
  const pad=70, w=Math.max(x1-x0,60)+pad*2, h=Math.max(y1-y0,60)+pad*2;
  const z=Math.min(9,Math.max(1,Math.min(box[2]/w,box[3]/h)));
  view.z=z;
  view.x=box[2]/2-((x0+x1)/2)*z;
  view.y=box[3]/2-((y0+y1)/2)*z;
  apply();
}

// 화면에 실제로 그려지는 배율 (viewBox → CSS 픽셀)
function ppu(){
  const r=wrap.getBoundingClientRect();
  return Math.min(r.width/box[2], r.height/box[3]) || 1;
}

function render(){
  document.getElementById("map").classList.toggle("zoomed",view.z>=2.6);
  // k를 곱하면 화면상 크기가 기기·배율과 무관하게 일정해진다
  const k=1/(ppu()*view.z);
  const sg=document.getElementById("stn"), pg=document.getElementById("spot");
  const cg=document.getElementById("city");
  sg.innerHTML=""; pg.innerHTML=""; cg.innerHTML="";

  // ── 시·군·구 : 확대하면 경계선, 더 확대하면 지역명 ──
  if(view.z>=1.8 && CT.length){
    const inView=c=>{                       // 화면 안에 있는 것만 그린다
      const r=wrap.getBoundingClientRect(), sc=box[2]/r.width;
      const x=c.cx*view.z+view.x, y=c.cy*view.z+view.y;
      const m=140;
      return x>-m && y>-m && x<r.width*sc+m && y<r.height*sc+m;
    };
    const show=CT.filter(inView);
    show.forEach(c=>cg.appendChild(el("path",{d:c.d,class:"city",
      "stroke-width":Math.max(0.6,1.4*k)})));
    if(view.z>=2.6) show.forEach(c=>{
      const t=el("text",{x:c.cx,y:c.cy,class:"clabel",
        transform:`translate(${c.cx} ${c.cy}) scale(${k}) translate(${-c.cx} ${-c.cy})`});
      t.textContent=c.name.replace(/(특별자치)?[시군구]$/,"")||c.name;
      cg.appendChild(t);
    });
  }

  // ── 기차역 (교통수단으로 여행지 고르는 용도 → 크게) ──
  const layers=[[state.ktx,"KTX","var(--hot)",11,13],
                [state.trn,"기차","#6E655B",9,12]];
  layers.forEach(([on,kind,color,r,fs])=>{
    if(!on) return;
    (ST[kind]||[]).forEach(st=>{
      const [x,y]=prj(st.lat,st.lng);
      const g=el("g",{class:"stn",transform:`translate(${x} ${y}) scale(${k})`});
      g.appendChild(el("circle",{r:r+3,fill:"#fff",opacity:.9}));
      g.appendChild(el("circle",{r:r,fill:color}));
      g.appendChild(el("circle",{r:r*0.38,fill:"#fff"}));
      if(view.z>=1.5){            // 전국 보기에선 점만, 조금 확대하면 역 이름
        const t=el("text",{y:-r-7,style:`font-size:${fs}px`});
        t.textContent=st.name.replace(/역$/,"");
        g.appendChild(t);
      }
      sg.appendChild(g);
    });
  });

  // ── 관광지 : 배율에 따라 점 → 아이콘 → 아이콘+이름 ──
  const mode = view.z<2 ? "dot" : (view.z<3.2 ? "icon" : "full");
  P.filter(p=>!state.region||grp(p)===state.region).forEach(p=>{
    const [x,y]=prj(p.lat,p.lng), c=`var(${HUE[p.cat]||"--blue"})`;
    const g=el("g",{class:"spot"+(state.sel===p.id?" sel":"")+(isFav(p.id)?" fav":""),
                    transform:`translate(${x} ${y}) scale(${k})`});
    if(mode==="dot"){
      g.appendChild(el("circle",{r:9,fill:"transparent"}));      // 터치 영역
      g.appendChild(el("circle",{r:4.5,fill:c,stroke:"#fff","stroke-width":1.6,class:"dot"}));
    }else{
      g.appendChild(el("circle",{r:19,class:"disc",stroke:c}));
      const e=el("text",{class:"emo",y:1}); e.textContent=ICON[p.cat]||"📍"; g.appendChild(e);
      if(mode==="full"&&!(state.ktx||state.trn)||mode==="full"&&view.z>=4){
        const t=el("text",{class:"nm",y:36}); t.textContent=p.name; g.appendChild(t);
      }
    }
    g._p=p;                     // 요소에 장소를 붙여둔다
    pg.appendChild(g);
  });

  // ── 내 위치 ──
  const mg=document.getElementById("me"); mg.innerHTML="";
  if(ME){
    const [x,y]=prj(ME.lat,ME.lng);
    const g=el("g",{transform:`translate(${x} ${y}) scale(${k})`});
    g.appendChild(el("circle",{r:16,fill:"var(--blue)",opacity:.18}));
    g.appendChild(el("circle",{r:7,fill:"var(--blue)",stroke:"#fff","stroke-width":3}));
    mg.appendChild(g);
  }
}

/* ── 팬 · 줌 (마우스 휠 · 손가락 핀치 · 더블탭) ── */
const cam=()=>document.getElementById("cam");
const wrap=document.getElementById("wrap");

function apply(rerender=true){
  cam().setAttribute("transform",`translate(${view.x} ${view.y}) scale(${view.z})`);
  if(rerender) render();
}
function fit(){view={x:0,y:0,z:1}; apply();}

// (cx,cy)=화면 좌표 기준으로 f배 확대
function zoomAt(f,cx,cy,rerender=true){
  const r=wrap.getBoundingClientRect();
  const sc=box[2]/r.width;
  const mx=cx*sc, my=cy*sc;
  const z2=Math.min(60,Math.max(1,view.z*f));
  if(z2===view.z) return;
  view.x=mx-(mx-view.x)*(z2/view.z);
  view.y=my-(my-view.y)*(z2/view.z);
  view.z=z2;
  if(z2===1){view.x=0;view.y=0;}
  apply(rerender);
}
const zoomCenter=f=>{const r=wrap.getBoundingClientRect(); zoomAt(f,r.width/2,r.height/2);};

wrap.addEventListener("wheel",e=>{
  e.preventDefault();
  const r=wrap.getBoundingClientRect();
  zoomAt(e.deltaY<0?1.18:1/1.18, e.clientX-r.left, e.clientY-r.top);
},{passive:false});

// 포인터 추적 — 1개=이동, 2개=핀치 확대
const pts=new Map();
let drag=null, last2=null, tapT=0, tapX=0, tapY=0;

wrap.addEventListener("pointerdown",e=>{
  wrap.setPointerCapture(e.pointerId);
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1){
    const sp=e.target.closest && e.target.closest(".spot");
    drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y,moved:false,spot:sp&&sp._p};
    wrap.classList.add("drag");
  }else{
    drag=null; last2=null;               // 두 손가락 → 핀치 시작
  }
});

wrap.addEventListener("pointermove",e=>{
  if(!pts.has(e.pointerId)) return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const a=[...pts.values()], r=wrap.getBoundingClientRect(), sc=box[2]/r.width;

  if(a.length>=2){                        // ── 핀치 확대/축소 + 이동 ──
    const d=Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y);
    const mx=(a[0].x+a[1].x)/2, my=(a[0].y+a[1].y)/2;
    if(last2){
      if(last2.d>0) zoomAt(d/last2.d, mx-r.left, my-r.top, false);
      view.x+=(mx-last2.mx)*sc; view.y+=(my-last2.my)*sc;
      apply(false);
    }
    last2={d,mx,my};
    return;
  }
  if(drag){                               // ── 한 손가락 이동 ──
    const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    if(Math.abs(dx)>4||Math.abs(dy)>4) drag.moved=true;
    view.x=drag.vx+dx*sc; view.y=drag.vy+dy*sc;
    apply(false);
  }
});

function endPointer(e){
  pts.delete(e.pointerId);
  if(pts.size<2) last2=null;
  if(pts.size===0){
    const d=drag; drag=null; wrap.classList.remove("drag");
    if(d && !d.moved){
      if(d.spot){                          // 관광지를 눌렀다 → 상세 열기
        open(d.spot); return;
      }
      // 빈 곳: 더블탭이면 확대, 아니면 패널 닫기
      const now=Date.now(), r=wrap.getBoundingClientRect();
      if(now-tapT<300 && Math.hypot(e.clientX-tapX,e.clientY-tapY)<30){
        zoomAt(2, e.clientX-r.left, e.clientY-r.top); tapT=0; return;
      }
      tapT=now; tapX=e.clientX; tapY=e.clientY;
      if(!e.target.closest || !e.target.closest(".panel")) closePanel();
      return;
    }
    render();                              // 제스처 끝나면 마커 크기 정상화
  }
}
wrap.addEventListener("pointerup",endPointer);
wrap.addEventListener("pointercancel",endPointer);

/* ══════════ 검색 · 즐겨찾기 · 저장 리스트 ══════════ */
const LS="whereto.lists.v1";
let LISTS=[], IDX=[];

const toast=m=>{const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),1700);};
const loadLists=()=>{try{LISTS=JSON.parse(localStorage.getItem(LS))||[];}catch(e){LISTS=[];}
  if(!LISTS.length) LISTS=[{id:"d",name:"가고 싶은 곳",items:[]}];};
const saveLists=()=>{try{localStorage.setItem(LS,JSON.stringify(LISTS));}catch(e){}};
const allItems=()=>LISTS.flatMap(l=>l.items);
const isFav=k=>allItems().some(i=>i.k===k);

/* ── 검색 인덱스: 관광지 + 주변 맛집·카페·놀거리 ── */
function buildIndex(){
  IDX=[];
  P.forEach(p=>{
    IDX.push({k:p.id,name:p.name,sub:`${p.region} · ${p.cat}`,emo:ICON[p.cat]||"📍",
              lat:p.lat,lng:p.lng,kind:"관광지",place:p});
    [["food","맛집","🍽️"],["cafe","카페","☕"],["fun","놀거리","🎠"]].forEach(([key,label,e])=>{
      (p[key]||[]).forEach(f=>{
        if(f.lat==null) return;
        IDX.push({k:`${key}:${p.id}:${f.name}`,name:f.name,
                  sub:`${label} · ${p.name} 주변 ${f.dist}m`,emo:e,
                  lat:f.lat,lng:f.lng,kind:label,url:f.url,near:p});
      });
    });
  });
}
const norm=t=>t.replace(/\s/g,"").toLowerCase();

/* ── 전국 검색 (카카오) — 내 데이터에 없는 곳까지 ── */
let KPS=null, kqSeq=0;
function initKakao(){
  if(!window.kakao||!kakao.maps) return;
  kakao.maps.load(()=>{ try{ KPS=new kakao.maps.services.Places(); }catch(e){} });
}
function kakaoSearch(q,cb,tries=0){
  if(!KPS){                                       // SDK 로딩 전이면 잠깐 기다렸다 재시도
    if(tries<20) return setTimeout(()=>kakaoSearch(q,cb,tries+1),150);
    return cb([]);
  }
  const seq=++kqSeq;
  KPS.keywordSearch(q,(data,st)=>{
    if(seq!==kqSeq) return;                       // 늦게 온 응답 버림
    if(st!==kakao.maps.services.Status.OK) return cb([]);
    cb(data.slice(0,12).map(d=>({
      k:"kk:"+d.id, name:d.place_name,
      sub:(d.category_group_name||d.category_name.split(">").pop().trim()||"장소")
          +" · "+(d.road_address_name||d.address_name||""),
      emo:KEMO[d.category_group_code]||"📌",
      lat:+d.y, lng:+d.x, url:d.place_url, kind:"전국 검색"})));
  },{size:12});
}
const KEMO={FD6:"🍽️",CE7:"☕",AT4:"🗺️",CT1:"🎭",AD5:"🏨",SW8:"🚇",PK6:"🅿️",
            MT1:"🛒",CS2:"🏪",OL7:"⛽",HP8:"🏥",PM9:"💊",BK9:"🏦",AC5:"🏫"};

function search(q){
  const n=norm(q); if(n.length<1) return [];
  const hit=IDX.filter(v=>norm(v.name).includes(n)||norm(v.sub).includes(n));
  hit.sort((a,b)=>{
    const ap=norm(a.name).startsWith(n)?0:1, bp=norm(b.name).startsWith(n)?0:1;
    if(ap!==bp) return ap-bp;
    if((a.kind==="관광지")!==(b.kind==="관광지")) return a.kind==="관광지"?-1:1;
    return a.name.length-b.name.length;
  });
  return hit.slice(0,40);
}

const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rowHTML=(v,i)=>`<button data-i="${i}"><span class="e">${v.emo}</span>
      <span><span class="t">${esc(v.name)}</span><span class="m">${esc(v.sub)}</span></span>
      <span class="star ${isFav(v.k)?"on":""}" data-f="${i}" style="margin-left:auto">★</span></button>`;

function drawResults(q){
  const sb=document.getElementById("sbox"), res=document.getElementById("res");
  sb.classList.toggle("has",!!q);
  if(!q){res.classList.remove("on");res.innerHTML="";return;}

  // 1) 내장 데이터(관광지 + 주변 맛집·카페·놀거리) 먼저 그린다.
  //    종류가 바뀔 때마다 헤더를 넣으면 관련도순 정렬 때문에 같은 헤더가 여러 번 나온다
  //    → 종류별로 묶어 헤더는 한 번씩만, 묶음 순서·묶음 안 순서는 관련도 그대로.
  const hit=search(q);
  res._hit=hit;
  const kinds=[]; hit.forEach(v=>{if(!kinds.includes(v.kind)) kinds.push(v.kind);});
  let h="";
  kinds.forEach(kind=>{
    h+=`<div class="rg">${kind}</div>`;
    hit.forEach((v,i)=>{if(v.kind===kind) h+=rowHTML(v,i);});
  });
  h+=`<div class="none" id="pend">전국에서 더 찾는 중…</div>`;
  res.innerHTML=h; res.classList.add("on");

  // 2) 내장에 없어도 전국 검색은 항상 이어서 붙인다 (여기서 return 하면 안 됨)
  kakaoSearch(q,ext=>{
    if(document.getElementById("q").value.trim()!==q) return;
    const key=v=>norm(v.name)+Math.round(v.lat*1e4);
    const seen=new Set(hit.map(key));
    const add=ext.filter(v=>!seen.has(key(v)));
    const pend=document.getElementById("pend");
    if(!pend) return;
    if(!add.length){                      // 전국에도 없으면 대기 문구를 결과 없음으로 바꾼다
      pend.outerHTML = hit.length ? "" :
        `<div class="none">"${esc(q)}" 에 맞는 곳이 없어요.<br>
         <span style="font-size:11.5px">관광지 이름이나 그 주변 가게 이름으로 찾아보세요.</span></div>`;
      return;
    }
    res._hit=hit.concat(add);
    let hh=`<div class="rg">전국 검색</div>`;
    add.forEach((v,i)=>{hh+=rowHTML(v,hit.length+i);});
    pend.outerHTML=hh;
    res.classList.add("on");
  });
}

/* ── 검색 결과 선택 → 지도 이동 ── */
function goTo(v){
  const [x,y]=prj(v.lat,v.lng);
  const r=wrap.getBoundingClientRect(), sc=box[2]/r.width;
  view.z=Math.max(view.z,9);
  view.x=box[2]/2-x*view.z; view.y=box[3]/2-y*view.z;
  apply();
  if(v.place) open(v.place);
  else if(v.near) open(v.near);
  document.getElementById("res").classList.remove("on");
}

function toggleFav(v){
  const cur=LISTS[0];

/* ── 공유: 목록을 링크에 담기 ── */
const b64e=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const b64d=t=>JSON.parse(decodeURIComponent(escape(atob(t))));
function shareList(){
  const L=LISTS[openList];
  if(!L.items.length) return toast("담은 곳이 없어요");
  const pack={n:L.name,i:L.items.map(v=>[v.name,+v.lat.toFixed(5),+v.lng.toFixed(5),v.emo||"📍",v.sub||""])};
  const url=location.origin+location.pathname+"#share="+b64e(pack);
  (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject())
    .then(()=>toast("링크를 복사했어요"))
    .catch(()=>{prompt("이 링크를 복사해 보내세요",url);});
}
function readShare(){
  const m=location.hash.match(/#share=(.+)$/); if(!m) return;
  try{
    const d=b64d(m[1]);
    const items=d.i.map(a=>({k:"sh:"+a[0]+a[1],name:a[0],lat:a[1],lng:a[2],emo:a[3],sub:a[4]}));
    if(!LISTS.some(l=>l.name===d.n+" (공유받음)"))
      LISTS.push({id:"s"+Date.now(),name:d.n+" (공유받음)",items});
    saveLists(); openList=LISTS.length-1;
    history.replaceState(null,"",location.pathname);
    setTimeout(()=>{sheet(true);toast(`"${d.n}" 목록을 받았어요`);},600);
  }catch(e){}
}

/* ── 이벤트 ── */
function wireUI(){
  const q=document.getElementById("q"), res=document.getElementById("res");
  q.addEventListener("input",()=>drawResults(q.value.trim()));
  q.addEventListener("focus",()=>{if(q.value.trim())drawResults(q.value.trim());});
  document.getElementById("qclr").onclick=()=>{q.value="";drawResults("");q.focus();};
  res.addEventListener("click",e=>{
    const st=e.target.closest(".star");
    if(st){e.stopPropagation();return toggleFav(res._hit[+st.dataset.f]);}
    const b=e.target.closest("button[data-i]"); if(b) goTo(res._hit[+b.dataset.i]);
  });
  document.addEventListener("click",e=>{
    if(!e.target.closest("#sbox")) res.classList.remove("on");
  });

  document.getElementById("sheet").addEventListener("click",e=>{
    if(e.target.id==="sheet") return sheet(false);
    const t=e.target;
    if(t.id==="cls") return sheet(false);
    if(t.id==="shr") return shareList();
    if(t.id==="addl"){
      const v=document.getElementById("newl").value.trim();
      if(!v) return; LISTS.push({id:"l"+Date.now(),name:v,items:[]});
      openList=LISTS.length-1; saveLists(); sheet(); return;
    }
    if(t.dataset.open!=null){openList=+t.dataset.open;sheet();return;}
    if(t.dataset.ren!=null){
      const i=+t.dataset.ren, v=prompt("목록 이름",LISTS[i].name);
      if(v&&v.trim()){LISTS[i].name=v.trim();saveLists();sheet();} return;
    }
    if(t.dataset.del!=null){
      const i=+t.dataset.del;
      if(confirm(`"${LISTS[i].name}" 목록을 지울까요?`)){
        LISTS.splice(i,1); openList=0; saveLists(); sheet(); render();
      } return;
    }
    if(t.dataset.rm){
      LISTS[openList].items=LISTS[openList].items.filter(x=>x.k!==t.dataset.rm);
      saveLists(); sheet(); render(); return;
    }
  });
}

/* ── 내 위치 ── */
function locate(btn){
  if(!navigator.geolocation) return alert("이 브라우저에서는 위치를 쓸 수 없어요.");
  btn.textContent="📍 찾는 중…";
  navigator.geolocation.getCurrentPosition(pos=>{
    ME={lat:pos.coords.latitude,lng:pos.coords.longitude};
    btn.textContent="📍 내 위치"; btn.classList.add("on");
    render();
    if(state.sel){ const p=P.find(v=>v.id===state.sel); if(p) open(p); }
  },err=>{
    btn.textContent="📍 내 위치";
    alert(err.code===1 ? "위치 권한이 거부됐어요. 브라우저 설정에서 허용해 주세요."
                       : "위치를 가져오지 못했어요.");
  },{enableHighAccuracy:true,timeout:10000,maximumAge:60000});
}

/* ── 상세 패널 ── */
function open(p){
  state.sel=p.id;
  const go=[];
  if(p.subway) go.push(`<div>🚇 <span>${p.subway.name}</span><b>${p.subway.dist}m</b></div>`);
  if(p.station?.KTX) go.push(`<div>🚄 <span>${p.station.KTX.name}</span><b>${p.station.KTX.km}km</b></div>`);
  if(p.station?.["기차"]) go.push(`<div>🚂 <span>${p.station["기차"].name}</span><b>${p.station["기차"].km}km</b></div>`);

  const li=(a,cat)=>a.map(f=>`<a href="${f.url}" target="_blank" rel="noopener"><span class="n">${f.name}</span>
      ${cat&&f.cat?`<span class="c">${f.cat}</span>`:""}<span class="d">${f.dist}m</span></a>`).join("");
  const h=HUE[p.cat]||"--blue";

  // 내 위치 → 목적지
  let route="";
  if(ME){
    const km=hav(ME.lat,ME.lng,p.lat,p.lng);
    const kakao=`https://map.kakao.com/link/to/${encodeURIComponent(p.name)},${p.lat},${p.lng}`;
    const naver=`https://map.naver.com/p/directions/${ME.lng},${ME.lat},%EB%82%B4%20%EC%9C%84%EC%B9%98/-/${p.lng},${p.lat},${encodeURIComponent(p.name)}/-/car`;
    route=`<div class="sec"><h3>내 위치에서</h3>
      <div class="dist">직선거리 <b>${km<1?Math.round(km*1000)+"m":km.toFixed(1)+"km"}</b>
        <span>· 아래에서 실제 경로와 소요시간을 확인하세요</span></div>
      <div class="routes">
        <a href="${kakao}" target="_blank" rel="noopener">🗺️ 카카오맵 길찾기</a>
        <a href="${naver}" target="_blank" rel="noopener">🧭 네이버 길찾기</a>
      </div></div>`;
  }else{
    route=`<div class="sec"><button class="askloc" onclick="locate(document.getElementById('meBtn'))">
      📍 내 위치를 켜면 여기까지 가는 길을 알려드려요</button></div>`;
  }

  document.getElementById("panel").innerHTML=`
    <div class="hero">${p.img?`<img src="${p.img}" alt="${p.name}">`:`<div class="none">${ICON[p.cat]||"📍"}</div>`}
      <button class="close" onclick="closePanel()">✕</button></div>
    <div class="pbody">
      <div class="ptitle"><h2>${p.name}</h2><button class="star ${isFav(p.id)?"on":""}" onclick="toggleFav({k:'${p.id}',name:'${p.name.replace(/'/g,"")}',sub:'${p.region} · ${p.cat}',emo:'${ICON[p.cat]||"📍"}',lat:${p.lat},lng:${p.lng}})">★</button>
        <span class="tag" style="background:var(${h}-bg);color:var(${h})">${ICON[p.cat]||""} ${p.cat}</span>
        <span class="tag" style="background:var(--bg);color:var(--ink3)">${p.region}</span></div>
      <p class="addr">${p.addr||""}</p>
      ${p.desc?`<p class="desc">${p.desc}</p>`:""}
      ${route}
      ${go.length?`<div class="sec"><h3>대중교통</h3><div class="go">${go.join("")}</div></div>`:""}
      ${p.fun?.length?`<div class="sec"><h3>주변 놀거리</h3><div class="list">${li(p.fun,1)}</div></div>`:""}
      ${p.food?.length?`<div class="sec"><h3>주변 맛집</h3><div class="list">${li(p.food,1)}</div></div>`:""}
      ${p.cafe?.length?`<div class="sec"><h3>주변 카페</h3><div class="list">${li(p.cafe,0)}</div></div>`:""}
      ${p.wiki?`<a class="more" href="${p.wiki}" target="_blank" rel="noopener">위키백과에서 더 보기 →</a>`:""}
    </div>`;
  document.getElementById("panel").classList.add("open");
  document.getElementById("panel").scrollTop=0;
  render();
}
function closePanel(){state.sel=null;document.getElementById("panel").classList.remove("open");render();}
window.closePanel=closePanel; window.toggleFav=toggleFav; window.sheet=sheet;

boot();
</script>
